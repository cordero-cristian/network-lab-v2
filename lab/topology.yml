---
name: feature004
provider: clab

defaults:
  device: srlinux
  devices:
    srlinux:
      clab:
        image: ghcr.io/nokia/srlinux:26.7.2-519

addressing:
  mgmt:
    _network: network-lab-devices-mgmt
    ipv4: 172.31.46.0/24

nodes:
  f004-spine01:
    mgmt:
      ipv4: 172.31.46.11
    clab:
      startup-config: bootstrap/f004-spine01.cli
  f004-leaf01:
    mgmt:
      ipv4: 172.31.46.12
    clab:
      startup-config: bootstrap/f004-leaf01.cli

links:
  - interfaces:
      - node: f004-spine01
        ifname: ethernet-1/1
      - node: f004-leaf01
        ifname: ethernet-1/1
